# /etc/nginx/sites-available/peptidesweden
# Certbot fyller i ssl_certificate-raderna automatiskt (se deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name peptidesweden.com www.peptidesweden.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://peptidesweden.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.peptidesweden.com;
    ssl_certificate     /etc/letsencrypt/live/peptidesweden.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peptidesweden.com/privkey.pem;
    return 301 https://peptidesweden.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name peptidesweden.com;

    ssl_certificate     /etc/letsencrypt/live/peptidesweden.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peptidesweden.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    client_max_body_size 2m;

    # Byggda filer med hash i namnet: cacha länge
    location /assets/ {
        root /var/www/peptidesweden/.output/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @app { proxy_pass http://127.0.0.1:3000; }
}
